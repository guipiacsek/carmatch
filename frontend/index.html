    <script>
      // Theme before first paint (same rule as src/lib/theme.ts), so dark mode doesn't flash white.
      try {
        var t = localStorage.getItem("carmatch.theme")
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
