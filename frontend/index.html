<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarMatch: find your next car</title>
    <meta name="description" content="Answer a few questions and get 9 ranked car recommendations grounded in EPA data." />
    <script>
      // Theme before first paint (same rule as src/lib/theme.ts), so dark mode doesn't flash white.
      try {
        var t = localStorage.getItem("carmatch.theme")
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
