<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarMatch · Concept 3: Night Showroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#08090b; --panel:#121419; --ink:#f2f3f5; --muted:#8b909c; --accent:#c6ff3d; --line:#23262e; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Space Grotesk",system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  .mono { font-family:"JetBrains Mono",monospace; }
  nav { display:flex; align-items:center; justify-content:space-between; padding:20px clamp(16px,4vw,48px); position:relative; z-index:2; }
  nav b { font-size:20px; letter-spacing:-.5px; } nav b span { color:var(--accent); }
  nav .links { display:flex; gap:24px; color:var(--muted); font-size:14px; } nav .links a { color:inherit; text-decoration:none; } nav .links a[aria-current] { color:var(--ink); }
  .hero { position:relative; min-height:min(78vh,720px); display:grid; align-items:end; padding:0 clamp(16px,4vw,48px) 40px; margin-top:-72px; overflow:hidden; }
  .hero img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.75; transition:opacity .4s; }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,#08090bcc 0%,#08090b00 30%,#08090b55 60%,#08090b 100%), radial-gradient(ellipse at 70% 40%,#0000 30%,#08090bb0 90%); }
  .hero-in { position:relative; z-index:1; display:grid; grid-template-columns:1fr auto; gap:28px; align-items:end; }
  .kicker { color:var(--accent); font-size:13px; letter-spacing:3px; }
  .hero h1 { font-size:clamp(40px,7vw,96px); line-height:.92; letter-spacing:-3px; margin:12px 0 18px; font-weight:700; }
  .specs { display:flex; flex-wrap:wrap; gap:10px; } .specs span { border:1px solid #ffffff2a; background:#0006; backdrop-filter:blur(8px); padding:8px 12px; border-radius:99px; font-size:13px; }
  .ring { width:150px; height:150px; position:relative; display:grid; place-items:center; } .ring svg { position:absolute; inset:0; transform:rotate(-90deg); }
  .ring b { font-size:38px; } .ring small { display:block; text-align:center; color:var(--muted); font-size:11px; letter-spacing:2px; }
  .cta-row { display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; }
  .btn { border:0; border-radius:14px; padding:14px 22px; font:600 15px "Space Grotesk"; cursor:pointer; }
  .btn.primary { background:var(--accent); color:#0b0c0e; } .btn.ghost { background:#ffffff14; color:var(--ink); border:1px solid #ffffff24; }
  .price { font-size:28px; font-weight:700; } .price small { display:block; font-size:11px; color:var(--muted); letter-spacing:2px; font-weight:500; }
  .strip { padding:28px clamp(16px,4vw,48px) 60px; }
  .strip h2 { font-size:14px; color:var(--muted); letter-spacing:3px; margin-bottom:16px; font-weight:500; }
  .film { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(220px,1fr); gap:14px; overflow-x:auto; padding-bottom:10px; scrollbar-color:#333 transparent; }
  .thumb { background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; cursor:pointer; text-align:left; color:inherit; font:inherit; padding:0; transition:border-color .2s, transform .2s; }
  .thumb:hover { transform:translateY(-3px); } .thumb[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 10px 40px #c6ff3d22; }
  .thumb img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; filter:saturate(.85); }
  .thumb div { padding:12px 14px 14px; display:grid; gap:4px; } .thumb .n { color:var(--accent); font-size:12px; } .thumb b { font-size:15px; } .thumb small { color:var(--muted); font-size:12px; }
  .side { position:fixed; top:0; right:0; height:100%; width:min(460px,100%); background:var(--panel); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .35s cubic-bezier(.2,.8,.2,1); z-index:10; overflow-y:auto; padding:28px; display:grid; gap:18px; align-content:start; grid-auto-rows:max-content; }
  .side.open { transform:none; box-shadow:-30px 0 80px #000a; }
  .side img { width:100%; border-radius:16px; aspect-ratio:16/10; object-fit:cover; }
  .table { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .table div { padding:12px 14px; border-bottom:1px solid var(--line); font-size:14px; } .table div:nth-child(odd) { color:var(--muted); font-size:12px; letter-spacing:1px; }
  .skel { height:11px; border-radius:6px; background:linear-gradient(90deg,#1c1f26,#2a2e37,#1c1f26); background-size:200% 100%; animation:sh 1.2s infinite; } @keyframes sh { to { background-position:-200% 0 } }
  .x { justify-self:end; background:none; border:1px solid var(--line); color:var(--ink); width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:18px; }
  footer { color:var(--muted); font-size:12px; padding:0 clamp(16px,4vw,48px) 40px; }
  .credit { position:absolute; right:clamp(16px,4vw,48px); top:80px; z-index:1; font-size:10px; color:#ffffff88; } .credit a { color:inherit; }
  @media (max-width:720px) { .hero-in { grid-template-columns:1fr; } .ring { width:110px; height:110px; } .ring b { font-size:28px; } nav .links { display:none; } }
</style>
</head>
<body>
<nav><b>Car<span>Match</span></b><div class="links"><a href="#" aria-current="page">Matches</a><a href="#">Compare</a><a href="#">Favorites</a><a href="#">New search</a></div></nav>
<section class="hero" aria-live="polite">
  <img id="hImg" alt="">
  <p class="credit" id="hCredit"></p>
  <div class="hero-in">
    <div>
      <div class="kicker mono" id="hRank"></div>
      <h1 id="hName"></h1>
      <div class="specs mono" id="hSpecs"></div>
      <div class="cta-row"><div class="price" id="hPrice"></div><button class="btn primary" id="details">Full details</button><button class="btn ghost">♡ Save</button><button class="btn ghost">⇄ Compare</button></div>
    </div>
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="#ffffff1a" stroke-width="6" fill="none"/><circle id="arc" cx="50" cy="50" r="44" stroke="var(--accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5" style="transition:stroke-dashoffset .6s"/></svg>
      <div><b id="hScore"></b><small class="mono">MATCH</small></div>
    </div>
  </div>
</section>
<section class="strip"><h2 class="mono">YOUR 9 MATCHES · USED SUV · ≤ $30K · AWD</h2><div class="film" id="film"></div></section>
<footer>Prices are AI estimates, not offers. EPA data via fueleconomy.gov. Photos: Wikimedia Commons contributors.</footer>
<aside class="side" id="side" aria-label="Car details" aria-hidden="true"></aside>
<script>
const CARS = [{"year":2021,"make":"Toyota","model":"RAV4 Hybrid","fuel":"Hybrid","body":"SUV","mpg":40,"mpge":null,"drive":"AWD","seats":5,"price":[26000,31000],"score":94,"over":false,"bullets":["40 MPG combined with standard AWD","Toyota's reliability record","Roomy cargo for family gear"],"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5b/2021_Toyota_RAV4_PHV.jpg/500px-2021_Toyota_RAV4_PHV.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","credit":"TTTNIS, CC0","page":"https://commons.wikimedia.org/wiki/File:2021_Toyota_RAV4_PHV.jpg"},{"year":2022,"make":"Honda","model":"CR-V Hybrid","fuel":"Hybrid","body":"SUV","mpg":38,"mpge":null,"drive":"AWD","seats":5,"price":[27000,32000],"score":92,"over":false,"bullets":["Huge rear seat and cargo area","38 MPG combined, smooth ride","Strong resale value"],"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/2022_Honda_CR-V_1.5_Turbo_Prestige%2C_IIMS_Hybrid%2C_Grand_City%2C_Central_Surabaya.jpg/500px-2022_Honda_CR-V_1.5_Turbo_Prestige%2C_IIMS_Hybrid%2C_Grand_City%2C_Central_Surabaya.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","credit":"Alex Neman, CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:2022_Honda_CR-V_1.5_Turbo_Prestige,_IIMS_Hybrid,_Grand_City,_Central_Surabaya.jpg"},{"year":2021,"make":"Mazda","model":"CX-5","fuel":"Gas","body":"SUV","mpg":28,"mpge":null,"drive":"AWD","seats":5,"price":[22000,27000],"score":89,"over":false,"bullets":["Upscale cabin for the price","Sharp handling, available AWD","Well under your budget"],"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/2022_Mazda_CX-5_2.0_front.jpg/500px-2022_Mazda_CX-5_2.0_front.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","credit":"ShangTW, CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:2022_Mazda_CX-5_2.0_front.jpg"},{"year":2022,"make":"Hyundai","model":"Tucson Hybrid","fuel":"Hybrid","body":"SUV","mpg":38,"mpge":null,"drive":"AWD","seats":5,"price":[24000,29000],"score":88,"over":false,"bullets":["38 MPG with standard AWD","Long warranty coverage","Tech-rich interior"],"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/2022_Hyundai_Tucson_Hybrid.jpg/500px-2022_Hyundai_Tucson_Hybrid.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","credit":"UltraTech66, CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:2022_Hyundai_Tucson_Hybrid.jpg"},{"year":2021,"make":"Subaru","model":"Forester","fuel":"Gas","body":"SUV","mpg":29,"mpge":null,"drive":"AWD","seats":5,"price":[21000,26000],"score":86,"over":false,"bullets":["Standard AWD, great visibility","Top safety scores","Easy to load and park"],"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/2021_Tokyo_Marathon_Referee_car_Subaru_Forester_SK_E-Boxer_%28White%29.jpg/500px-2021_Tokyo_Marathon_Referee_car_Subaru_Forester_SK_E-Boxer_%28White%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","credit":"Comyu, CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:2021_Tokyo_Marathon_Referee_car_Subaru_Forester_SK_E-Boxer_(White).jpg"},{"year":2023,"make":"Kia","model":"Sportage","fuel":"Gas","body":"SUV","mpg":28,"mpge":null,"drive":"AWD","seats":5,"price":[24000,29000],"score":84,"over":false,"bullets":["Class-leading rear legroom","Bold design, big screens","Warranty transfers in part"],"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/2023_Kia_Sportage_%28NQ5%29_in_White%2C_front_left.jpg/500px-2023_Kia_Sportage_%28NQ5%29_in_White%2C_front_left.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","credit":"Benespit, CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:2023_Kia_Sportage_(NQ5)_in_White,_front_left.jpg"},{"year":2021,"make":"Toyota","model":"RAV4 Prime","fuel":"Plug-in Hybrid","body":"SUV","mpg":38,"mpge":94,"drive":"AWD","seats":5,"price":[33000,38000],"score":82,"over":true,"bullets":["42 electric miles per charge","Quickest RAV4, 302 hp","Above budget but efficient"],"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/2021_Toyota_RAV4_Prime_au_SIAM_2020.jpg/500px-2021_Toyota_RAV4_Prime_au_SIAM_2020.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","credit":"Bull-Doser, Public domain","page":"https://commons.wikimedia.org/wiki/File:2021_Toyota_RAV4_Prime_au_SIAM_2020.jpg"},{"year":2020,"make":"Subaru","model":"Outback","fuel":"Gas","body":"Wagon","mpg":29,"mpge":null,"drive":"AWD","seats":5,"price":[20000,25000],"score":80,"over":false,"bullets":["Wagon practicality, SUV clearance","Standard AWD","Comfortable on long trips"],"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/2020_Subaru_Outback_AWD%2C_front.jpg/500px-2020_Subaru_Outback_AWD%2C_front.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","credit":"Kevauto, CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:2020_Subaru_Outback_AWD,_front.jpg"},{"year":2019,"make":"Honda","model":"Pilot","fuel":"Gas","body":"SUV","mpg":22,"mpge":null,"drive":"AWD","seats":8,"price":[23000,28000],"score":78,"over":false,"bullets":["Seats eight for growing families","Smooth V6, strong towing","Reliable, roomy third row"],"img":"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/2019_Honda_Pilot_EX-L_3.5L_front_1.5.19.jpg/500px-2019_Honda_Pilot_EX-L_3.5L_front_1.5.19.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail","credit":"Kevauto, CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:2019_Honda_Pilot_EX-L_3.5L_front_1.5.19.jpg"}];
const k = n => "$" + Math.round(n / 1000) + "k";
let cur = 0;
function show(i) {
  cur = i; const c = CARS[i];
  hImg.src = c.img.replace("/500px-", "/1280px-"); // full-bleed hero needs a larger Commons thumb hImg.alt = `${c.year} ${c.make} ${c.model}`;
  hCredit.innerHTML = `Photo: <a href="${c.page}" target="_blank" rel="noopener">${c.credit}</a>`;
  hRank.textContent = `#${i + 1} OF 9 · ${c.bullets[0].toUpperCase()}`;
  hName.innerHTML = `${c.year} ${c.make}<br>${c.model}`;
  hSpecs.innerHTML = [`${c.mpg} MPG${c.mpge ? " · " + c.mpge + " MPGe" : ""}`, c.fuel, c.drive, `${c.seats} seats`, c.body].map(s => `<span>${s}</span>`).join("");
  hPrice.innerHTML = `<small class="mono">AI ESTIMATE${c.over ? " · OVER BUDGET" : ""}</small>${k(c.price[0])}–${k(c.price[1])}`;
  hScore.textContent = c.score;
  arc.style.strokeDashoffset = 276.5 * (1 - c.score / 100);
  document.querySelectorAll(".thumb").forEach((t, j) => t.setAttribute("aria-pressed", j === i));
}
film.innerHTML = CARS.map((c, i) => `<button class="thumb" data-i="${i}" aria-pressed="false"><img src="${c.img}" alt="" loading="lazy">
  <div><span class="n mono">#${i + 1} · ${c.score}%</span><b>${c.year} ${c.make} ${c.model}</b><small>${k(c.price[0])}–${k(c.price[1])} · ${c.mpg} MPG · ${c.drive}</small></div></button>`).join("");
film.addEventListener("click", e => { const t = e.target.closest(".thumb"); if (t) { show(+t.dataset.i); scrollTo({ top: 0, behavior: "smooth" }); } });
details.onclick = () => {
  const c = CARS[cur];
  side.innerHTML = `<button class="x" aria-label="Close">×</button><img src="${c.img}" alt=""><div><div class="kicker mono">#${cur + 1} · ${c.score}% MATCH</div><h2 style="font-size:30px;letter-spacing:-1px;margin-top:6px">${c.year} ${c.make} ${c.model}</h2></div>
    <div class="table mono"><div>AI PRICE</div><div>${k(c.price[0])}–${k(c.price[1])}</div><div>EPA MPG</div><div>${c.mpg}${c.mpge ? " / " + c.mpge + "e" : ""}</div><div>FUEL</div><div>${c.fuel}</div><div>DRIVE</div><div>${c.drive}</div><div>SEATS</div><div>${c.seats}</div></div>
    <div style="display:grid;gap:8px"><span class="mono" style="color:var(--accent);font-size:12px">✦ AI RESEARCHING THIS CAR</span><div class="skel"></div><div class="skel" style="width:82%"></div><div class="skel" style="width:64%"></div></div>
    <div>${c.bullets.map(b => `<p style="margin:6px 0;color:#c9ccd3">→ ${b}</p>`).join("")}</div><button class="btn primary">See on Cars.com ↗</button>`;
  side.classList.add("open"); side.setAttribute("aria-hidden", "false");
  side.querySelector(".x").onclick = close; side.querySelector(".x").focus();
};
function close() { side.classList.remove("open"); side.setAttribute("aria-hidden", "true"); details.focus(); }
addEventListener("keydown", e => e.key === "Escape" && close());
show(0);
</script>
</body>
</html>
