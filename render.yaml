# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: carmatch-api
    runtime: python
    rootDir: backend
    # Python version comes from backend/.python-version. The build also downloads the EPA dataset into
    # backend/data so the first request after a deploy doesn't wait for it.
    buildCommand: pip install -r requirements.txt && python -m app.vehicles
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
      - key: RATE_LIMIT_PER_HOUR
        value: "8"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
